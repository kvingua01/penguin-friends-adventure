<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penguin Friends Adventure — Island Demo</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#071a29;color:#eff9f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#193e50,#071a29 70%);min-height:100vh}main{max-width:1020px;margin:auto;padding:28px 22px}.eyebrow{color:#95cecc;font-size:11px;letter-spacing:3px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-family:Georgia,serif;font-size:clamp(25px,4vw,39px);margin:10px 0 22px;font-weight:normal}header span{border:1px solid #49636c;padding:8px 12px;font-size:11px;color:#a9dbd8;white-space:nowrap}.bar{display:flex;justify-content:space-between;gap:15px;background:#102b39;border:1px solid #3d616a;padding:15px 18px;font-size:12px}.bar b{color:#ffd995}.stage{position:relative;border:1px solid #547984;border-top:0;background:#16495d;box-shadow:0 20px 65px #0005}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;outline:none}canvas:focus-visible{outline:3px solid #ffd995;outline-offset:3px}.dialogue{position:absolute;bottom:18px;left:18px;right:18px;padding:18px 22px;background:#091e2bf5;border:2px solid #8dc7ca;box-shadow:5px 5px 0 #03131e}.dialogue[hidden]{display:none}.dialogue strong{font-size:12px;color:#ffd995;letter-spacing:2px}.dialogue p{line-height:1.6;font-size:14px;margin:10px 0}.dialogue button{background:transparent;border:0;color:#a8dddb;font:inherit;font-size:12px;cursor:pointer;padding:8px 0}footer{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:#a8c3c9;line-height:1.8;padding:16px 0}kbd{color:#f5e5bf}button{touch-action:none}.touch{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:12px}.directions{display:grid;grid-template-columns:repeat(3,46px);gap:5px}.touch button,.restart{border:1px solid #557982;background:#153747;color:#edf8f2;padding:12px;font:inherit;cursor:pointer}.directions button:first-child{grid-column:2}.directions button:nth-child(2){grid-column:1}.interact{min-height:64px}.restart{font-size:11px;padding:8px;margin-top:10px}#hint{color:#ffd995;font-size:12px;min-height:20px;margin-top:14px}@media(max-width:560px){main{padding:18px 10px}header{display:block}header span{display:inline-block;margin-bottom:15px}.bar{font-size:10px;padding:12px}footer{display:block}.dialogue{bottom:8px;left:8px;right:8px;padding:10px 14px}.dialogue p{font-size:12px;margin:6px 0}}
</style>
</head>
<body><main>
<div class="eyebrow">A LITTLE PENGUIN. A GREAT BIG WORLD.</div>
<header><h1>Penguin Friends Adventure</h1><span>CHAPTER 01 · ISLAND DEMO</span></header>
<div class="bar"><span>❄ FROSTBELL ISLAND</span><span id="quest" aria-live="polite">Your first adventure: <b>Find Slippy</b></span></div>
<div class="stage"><canvas id="game" width="800" height="480" tabindex="0" aria-label="Frostbell Island exploration game. Move with arrow keys or WASD. Talk with E or Space."></canvas>
<section class="dialogue" id="dialogue" hidden aria-live="polite"><strong id="speaker"></strong><p id="line"></p><button id="next">Continue → [E / Space]</button></section></div>
<div id="hint" aria-live="polite">Follow the snowy path east to find your best friend.</div>
<footer><span><kbd>W A S D</kbd> / <kbd>↑ ↓ ← →</kbd> move &nbsp; <kbd>E</kbd> / <kbd>Space</kbd> talk</span><span>Explore slowly. Good friends are worth finding.</span></footer>
<div class="touch"><div class="directions" aria-label="Movement controls"><button data-key="arrowup" aria-label="Move up">↑</button><button data-key="arrowleft" aria-label="Move left">←</button><button data-key="arrowdown" aria-label="Move down">↓</button><button data-key="arrowright" aria-label="Move right">→</button></div><button class="interact" id="talk">E · TALK</button></div>
<button class="restart" id="restart">↻ Restart demo</button>
</main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const player={x:295,y:300},keys=new Set();
const npcs=[{name:'Slippy',x:490,y:300,color:'#a8d1e4'},{name:'Mama',x:285,y:177,color:'#c4aedf'},{name:'Pippy',x:604,y:196,color:'#88c4b3'},{name:'Trail sign',x:398,y:234,sign:true}];
const rocks=[{x:159,y:220,r:17},{x:193,y:345,r:20},{x:640,y:310,r:19},{x:566,y:376,r:17},{x:452,y:130,r:15}];
let quest=0,fish=true,dialogue=null,nearby=null,last=0,elapsed=0;
const box=document.getElementById('dialogue'),hint=document.getElementById('hint');
function updateQuest(){document.getElementById('quest').innerHTML=['Your first adventure: <b>Find Slippy</b>','A favor for a friend: <b>Find the silver fish</b>','Fish found! <b>Return to Slippy</b>','Adventure complete: <b>A friendship begins</b>'][quest];}
function openDialogue(name,lines,done){keys.clear();dialogue={name,lines,index:0,done};box.hidden=false;showLine();}
function showLine(){document.getElementById('speaker').textContent=dialogue.name;document.getElementById('line').textContent=dialogue.lines[dialogue.index];document.getElementById('next').textContent=dialogue.index===dialogue.lines.length-1?'Finish → [E / Space]':'Continue → [E / Space]';}
function interact(){if(dialogue){dialogue.index++;if(dialogue.index<dialogue.lines.length)showLine();else{const done=dialogue.done;dialogue=null;box.hidden=true;if(done)done();updateQuest();}return;}
 if(!nearby)return;
 if(nearby.name==='Silver fish'){fish=false;quest=2;updateQuest();openDialogue('FLIPPY',['A silver fish! Still chilly. Slippy is going to love this.']);return;}
 const name=nearby.name;
 if(name==='Slippy'){
 if(quest===0)openDialogue('SLIPPY',['Flippy! There you are! I was just thinking about a very important adventure.','An adventure to find lunch. I saw a silver fish by the western shore. Could you find it?'],()=>{quest=1;});
 else if(quest===1)openDialogue('SLIPPY',['Look near the little pool on the western shore. Follow the path left!']);
 else if(quest===2)openDialogue('SLIPPY',['You found it! You are officially my favorite explorer.','Someday we should sail beyond this island. Warm beaches. Mysterious caves. Really big lunches.','But today? Let’s share this fish. Thanks, Flippy.'],()=>{quest=3;});
 else openDialogue('SLIPPY',['One fish, two best friends. A pretty good beginning.','Our bigger adventure is still on the horizon.']);
 }else if(name==='Mama')openDialogue('MAMA',['There’s my brave little Flippy. The island is yours to explore, but keep your flippers dry!','Go say hello to Slippy. I think his stomach is making plans again.']);
 else if(name==='Pippy')openDialogue('PIPPY',['Ahoy, tiny traveler! Pippy’s the name. This boat and I have seen a few horizons.','The sea route isn’t ready yet. For now, there’s plenty of adventure right here.']);
 else openDialogue('TRAIL SIGN',['FROSTBELL ISLAND\n← Tide pool · Village ↑ · Dock →','A small island can be the start of a very big story.']);
}
function walkable(x,y){return ((x-400)/292)**2+((y-253)/182)**2<.94 && !rocks.some(r=>Math.hypot(x-r.x,y-r.y)<r.r+9) && !(x>235&&x<335&&y>87&&y<151) && !npcs.some(n=>Math.hypot(x-n.x,y-n.y)<19) && !(Math.hypot(x-223,y-269)<27);}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function penguin(x,y,color,baby=false,hat=false){x=Math.round(x);y=Math.round(y);ellipse(x,y+2,14,5,'#598f9b66');const bob=baby&&keys.size?Math.sin(elapsed*12)*1.5:0;y+=bob;rect(x-9,y-23,18,23,'#18394c');rect(x-12,y-18,24,14,'#18394c');rect(x-7,y-16,14,16,color);rect(x-9,y-27,18,13,'#18394c');rect(x-7,y-24,14,9,'#f3f6e9');rect(x-5,y-22,3,3,'#152a39');rect(x+3,y-22,3,3,'#152a39');rect(x-2,y-18,5,3,'#edb95f');rect(x-10,y,8,4,'#edb95f');rect(x+3,y,8,4,'#edb95f');rect(x-16,y-13,5,11,'#18394c');rect(x+12,y-13,5,11,'#18394c');if(baby){rect(x-10,y-11,20,4,'#ed9b73');rect(x+7,y-8,4,9,'#ed9b73');}if(hat){rect(x-11,y-30,22,5,'#f6ecd1');rect(x-7,y-35,14,6,'#f6ecd1');} }
function draw(){rect(0,0,800,480,'#194d63');for(let y=24;y<480;y+=30)for(let x=0;x<800;x+=55){rect(x+Math.sin(elapsed+y)*3,y,18,2,'#286579');rect(x+24,y+13,8,2,'#235b71');}
 ellipse(400,267,302,187,'#103b50');ellipse(400,260,295,183,'#6cabbc');ellipse(400,250,288,175,'#d6edef');ellipse(400,242,275,162,'#e9f6ee');
 ctx.strokeStyle='#c0dce0';ctx.lineWidth=29;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(225,270);ctx.lineTo(300,300);ctx.lineTo(490,300);ctx.lineTo(600,210);ctx.stroke();ctx.beginPath();ctx.moveTo(300,300);ctx.lineTo(285,158);ctx.stroke();
 for(let i=0;i<50;i++){const x=140+(i*83)%520,y=112+(i*47)%275;if(((x-400)/260)**2+((y-245)/155)**2<1){rect(x,y,3,2,'#badbdf');rect(x+6,y+4,2,2,'#badbdf');}}
 // Igloo, tide pool, dock, and a small moored boat.
 ellipse(285,128,51,40,'#b3d4df');ellipse(285,122,47,37,'#f7fcf2');for(let y=105;y<144;y+=12)rect(245,y,80,2,'#cee3e5');rect(271,120,27,29,'#28576a');ellipse(285,121,13,12,'#28576a');
 ellipse(223,269,30,22,'#92c7d9');ellipse(223,267,25,16,'#367d98');
 for(let i=0;i<5;i++){rect(643+i*16,188,14,31,'#9c8066');rect(643+i*16,190,2,26,'#c5aa83');}ellipse(727,227,24,12,'#775c4a');ellipse(727,224,21,9,'#c5aa83');rect(725,195,3,26,'#d9caa5');ctx.fillStyle='#e3dfbe';ctx.beginPath();ctx.moveTo(729,195);ctx.lineTo(746,216);ctx.lineTo(729,216);ctx.fill();
 rocks.forEach(r=>{ellipse(r.x,r.y,r.r,r.r*.65,'#88aebb');rect(r.x-r.r+5,r.y-r.r*.5,r.r,5,'#f2faf2');});
 if(fish){const fy=310+Math.sin(elapsed*3)*2;ellipse(175,fy,11,5,'#effcfc');ctx.fillStyle='#91d4df';ctx.beginPath();ctx.moveTo(166,fy);ctx.lineTo(158,fy-6);ctx.lineTo(158,fy+6);ctx.fill();rect(179,fy-2,2,2,'#204958');if(quest===1){ctx.fillStyle='#ffdb87';ctx.font='18px monospace';ctx.fillText('✧',168,fy-17);}}
 const actors=[...npcs,{...player,name:'Flippy',color:'#e8e4d5',baby:true}].sort((a,b)=>a.y-b.y);
 actors.forEach(n=>{if(n.sign){rect(n.x-2,n.y-14,4,17,'#8d7861');rect(n.x-17,n.y-30,34,20,'#a58e70');rect(n.x-12,n.y-24,24,2,'#ecdfb6');rect(n.x-12,n.y-19,17,2,'#ecdfb6');}else penguin(n.x,n.y,n.color,n.baby,n.name==='Pippy');});
 ctx.textAlign='center';ctx.font='11px monospace';ctx.fillStyle='#264f61';ctx.fillText('HOME',285,77);ctx.fillText('PIPPY’S DOCK',608,158);
 if(nearby&&!dialogue){const y=nearby.y-48;ctx.fillStyle='#102d3e';const label=nearby.name==='Silver fish'?'E · PICK UP':'E · '+nearby.name.toUpperCase();const w=ctx.measureText(label).width+16;ctx.fillRect(nearby.x-w/2,y-12,w,22);ctx.fillStyle='#fff1cc';ctx.fillText(label,nearby.x,y+3);}
 ctx.textAlign='left';
}
function frame(t){const dt=Math.min((t-last)/1000||0,.04);last=t;elapsed+=dt;if(!dialogue){let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),dy=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const length=Math.hypot(dx,dy)||1;dx=dx/length*115*dt;dy=dy/length*115*dt;if(walkable(player.x+dx,player.y))player.x+=dx;if(walkable(player.x,player.y+dy))player.y+=dy;const targets=[...npcs,...(fish&&quest===1?[{name:'Silver fish',x:175,y:310}]:[])];nearby=targets.filter(n=>Math.hypot(n.x-player.x,n.y-player.y)<48).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0]||null;const text=nearby?'Press E or Space to '+(nearby.name==='Silver fish'?'pick up the fish.':'talk to '+nearby.name+'.'):['Follow the snowy path east to find your best friend.','Look for a shimmering fish near the western tide pool.','Take the silver fish back to Slippy.','Demo complete! Keep exploring and meet Mama and Pippy.'][quest];if(hint.textContent!==text)hint.textContent=text;}draw();requestAnimationFrame(frame);}
const movement=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;const key=e.key.toLowerCase();if(movement.includes(key)){e.preventDefault();keys.add(key);}if(key==='e'||key===' '){e.preventDefault();if(!e.repeat)interact();}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());document.addEventListener('visibilitychange',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(b.dataset.key));});
document.getElementById('talk').onclick=interact;document.getElementById('next').onclick=interact;document.getElementById('restart').onclick=()=>{keys.clear();player.x=295;player.y=300;quest=0;fish=true;dialogue=null;box.hidden=true;updateQuest();canvas.focus();};canvas.addEventListener('pointerdown',()=>canvas.focus());
requestAnimationFrame(frame);
</script>
</body></html>
